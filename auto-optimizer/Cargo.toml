[package]
name = "nvoc-auto-optimizer"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

description = "NVIDIA GPU curve optimizer"
keywords = ["nvidia", "gtx", "gpu", "nvapi", "overclock"]

readme = "README.md"
license = "Apache-2.0"

include = [
    "/src/**",
    "/test/windows_gpu_event_query.ps1",
    "/test/windows_oc_pnp_recover.ps1",
    "/README*",
    "/LICENSE*",
]

[features]
# The stressor generation selectors mirror cli-stressor-cuda-rs: a bundled CUDA
# stressor must pick exactly one generation (cuda11 for R470-era drivers, cuda12
# otherwise), enforced by compile_error! in the stressor crate.
#
# `stressor-bundled` is only the "bundle the stressor crate in-process" switch
# that the source gates on; the features below choose its backend. Keeping the
# two apart is what lets a platform with no CUDA runtime (macOS has no
# NVAPI/NVML and no CUDA driver) build the bundled Vulkan-only stressor, while
# `stressor-bundled-cuda12` -- the default -- still turns on exactly the
# features it always did, cuda and vulkan, so no existing build changes.
default = ["stressor-bundled-cuda12"]
stressor-bundled = ["dep:cli-stressor-cuda-rs"]
stressor-bundled-cuda = [
  "stressor-bundled",
  "cli-stressor-cuda-rs/cuda",
  "cli-stressor-cuda-rs/vulkan",
]
stressor-bundled-cuda11 = ["stressor-bundled-cuda", "cli-stressor-cuda-rs/cuda11"]
stressor-bundled-cuda12 = ["stressor-bundled-cuda", "cli-stressor-cuda-rs/cuda12"]
# CUDA-free bundled stressor: the Vulkan path the macOS host already has a
# loader and an ICD for. Build it with
#   --no-default-features --features stressor-bundled-vulkan
stressor-bundled-vulkan = ["stressor-bundled", "cli-stressor-cuda-rs/vulkan"]
stressor-external = []

[dependencies]
nvoc-core = { workspace = true }
nvoc-cli-common = { workspace = true }
nvml-wrapper = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
csv = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
colored = { workspace = true }
indicatif = "0.18.4"
once_cell = "1.21.4"
cli-stressor-cuda-rs = { path = "../cli-stressor-cuda-rs", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_EventLog"] }
